<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>הדף לא נמצא · סגל אוטומציות</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/segal-app-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#F5F0EB,#16202E);--ink:light-dark(#16202E,#FFFFFF);--muted:light-dark(#46566B,#C7D2DF);--line:light-dark(#E2E7ED,#2C3B50);--box:light-dark(#FFFFFF,#1B2738);--action:light-dark(#16202E,#3FD9C6);--on-action:light-dark(#FFFFFF,#16202E)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 Rubik,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding-inline:max(5vw,16px)}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;max-width:1240px}
.logo{height:28px;width:auto;display:block}.logo.dk{display:none}
@media (prefers-color-scheme:dark){.logo.lt{display:none}.logo.dk{display:block}}
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;font-weight:500;font-size:15px}
.back:hover{border-color:var(--ink)}
:focus-visible{outline:3px solid #3FD9C6;outline-offset:2px}
main{padding-block:clamp(40px,7vw,80px)}
.label{margin:0 0 8px;font-size:13px;font-weight:500;letter-spacing:.14em;color:var(--muted)}
h1{margin:0;font-size:clamp(30px,4vw,40px);line-height:1.15}
.upd{margin:12px 0 0;color:var(--muted);font-size:15px}
h2{margin:40px 0 8px;font-size:22px;line-height:1.3}
p{margin:0 0 12px}
ul{margin:0 0 12px;padding-inline-start:22px}
li{margin-bottom:6px}
a{color:var(--ink);text-underline-offset:3px}
.box{background:var(--box);border:1px solid var(--line);border-radius:16px;padding:20px 24px;margin-top:12px}
.box p{margin:0}
.tbd{background:#FFE9B0;color:#5A3E00;border-radius:4px;padding:0 6px;font-weight:500}
footer{border-top:1px solid var(--line);padding-block:28px;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;max-width:1240px}
footer a{color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap">
  <a href="/" aria-label="סגל אוטומציות, לדף הבית"><img class="logo lt" src="/assets/segal-wordmark.svg" alt="" width="59" height="28"><img class="logo dk" src="/assets/segal-wordmark-dark-bg.svg" alt="" width="59" height="28"></a>
  <a class="back" href="/">חזרה לדף הבית</a>
</div></header>
<main><div class="wrap">
<p class="label">404</p>
<h1>הדף הזה לא נמצא</h1>
<p class="upd">ייתכן שהקישור השתנה. כל המידע נמצא בדף הבית.</p>
<p style="margin-top:28px"><a class="back" href="/">לדף הבית</a> &nbsp; <a class="back" href="/#contact">לתיאום שיחת היכרות</a></p>
</div></main>
<footer><div class="wrap"><span>© סגל אוטומציות · אריה סגל</span><a href="/accessibility">הצהרת נגישות</a><a href="/privacy">מדיניות פרטיות</a></div></footer>
</body>
</html>
