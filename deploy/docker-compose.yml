# סגל אוטומציות · האתר הראשי (segalautomations.cloud)
# שני שירותים קטנים, בנפרד מ-n8n (לא נוגעים בהגדרות שלו):
#   sync: מושך את המאגר מ-GitHub כל דקה ומעתיק את תיקיית site לתיקייה שמוגשת, בבת אחת
#   web:  nginx שמגיש את הדפים עם כותרות אבטחה. Traefik (שכבר רץ עם n8n) מנתב אליו את הכתובת ומנפיק https.
# CSP: קוד רק מהאתר, גופן מ-Google Fonts, והטופס שולח רק ל-n8n של סגל אוטומציות.
services:
  sync:
    image: alpine/git
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        [ -d /repo/.git ] || git clone --depth 1 --branch "$${BRANCH}" "$${REPO_URL}" /repo
        last=""
        while true; do
          git -C /repo fetch --depth 1 origin "$${BRANCH}" && git -C /repo reset --hard "origin/$${BRANCH}" >/dev/null
          head=$$(git -C /repo rev-parse HEAD)
          if [ "$$head" != "$$last" ] || [ ! -d /www/live ]; then
            rm -rf /www/next && mkdir -p /www/next && cp -r /repo/site/. /www/next/
            rm -rf /www/live.old
            if [ -d /www/live ]; then mv /www/live /www/live.old; fi
            mv /www/next /www/live && rm -rf /www/live.old
            echo "$$(date -u +%FT%TZ) עודכן לגרסה $$head"
            last="$$head"
          fi
          sleep 60
        done
    environment:
      - REPO_URL=${REPO_URL}
      - BRANCH=${BRANCH:-main}
    volumes:
      - repo:/repo
      - www:/www

  web:
    image: nginx:alpine
    restart: always
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/00-speed.conf <<'EOF'
        gzip on;
        gzip_comp_level 6;
        gzip_min_length 512;
        gzip_vary on;
        gzip_proxied any;
        gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;
        map $$uri $$sc_cache {
          default "no-cache";
          ~*\.(svg|webp|png|jpg|ico|woff2)$$ "public, max-age=300, stale-while-revalidate=604800";
        }
        EOF
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 80;
          root /www/live;
          index index.html;
          absolute_redirect off;
          server_tokens off;
          error_page 404 /404.html;
          add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://n8n.srv1187730.hstgr.cloud; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
          add_header X-Content-Type-Options "nosniff" always;
          add_header X-Frame-Options "DENY" always;
          add_header Referrer-Policy "strict-origin-when-cross-origin" always;
          add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
          add_header Strict-Transport-Security "max-age=31536000" always;
          add_header Cache-Control $$sc_cache always;
          location = / { try_files /index.html =404; }
          location = /index.html { return 301 /; }
          location = /404.html { internal; }
          location ~ ^/(.+)\.html$$ { return 301 /$$1$$is_args$$args; }
          location ~ /\. { return 404; }
          location / { try_files $$uri $$uri.html $$uri/ =404; }
        }
        EOF
        if ! nginx -t 2>/dev/null; then
          rm -f /etc/nginx/conf.d/00-speed.conf
          sed -i 's/add_header Cache-Control .*/add_header Cache-Control "no-cache" always;/' /etc/nginx/conf.d/default.conf
          echo "speed config rejected, serving without it"
        fi
        exec nginx -g 'daemon off;'
    volumes:
      - www:/www:ro
    networks:
      - n8n_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.segalsite.rule=Host(`segalautomations.cloud`) || Host(`www.segalautomations.cloud`)
      - traefik.http.routers.segalsite.entrypoints=web,websecure
      - traefik.http.routers.segalsite.tls=true
      - traefik.http.routers.segalsite.tls.certresolver=mytlschallenge
      - traefik.http.routers.segalsite.middlewares=segalsite-www
      - traefik.http.middlewares.segalsite-www.redirectregex.regex=^https?://www\.segalautomations\.cloud/(.*)
      - traefik.http.middlewares.segalsite-www.redirectregex.replacement=https://segalautomations.cloud/$${1}
      - traefik.http.middlewares.segalsite-www.redirectregex.permanent=true
      - traefik.http.services.segalsite.loadbalancer.server.port=80

volumes:
  repo:
  www:

networks:
  n8n_default:
    external: true
